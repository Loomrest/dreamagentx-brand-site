{{ define "main" }}
<article class="page page-home">
  <header class="hero">
    <p class="hero-label">品牌官网</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}<p class="hero-lead">{{ . }}</p>{{ end }}
  </header>
  <div class="content prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
