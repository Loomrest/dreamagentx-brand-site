<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  {{ with .Params.description }}<meta name="description" content="{{ . }}">{{ end }}
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-title" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
      <label for="nav-toggle" class="nav-toggle-btn">
        <span class="nav-toggle-icon" aria-hidden="true"></span>
        <span class="nav-toggle-text">菜单</span>
      </label>
      <nav class="site-nav" aria-label="主导航">
        <ul class="nav">
          {{ range .Site.Menus.main }}
          <li>
            <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
          {{ end }}
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p class="footer-brand">© {{ now.Year }} {{ .Site.Title }}</p>
      {{ with .Site.Params.companyName }}
      <p class="footer-company">{{ . }}</p>
      {{ end }}
    </div>
  </footer>
</body>
</html>
