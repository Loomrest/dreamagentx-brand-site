<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  {{ with .Params.description }}<meta name="description" content="{{ . }}">{{ end }}
  <link rel="icon" href="{{ "favicon.ico" | relURL }}?v=9" sizes="32x32">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}?v=9" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}?v=9">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}?v=16">
</head>
<body>
  <div class="site-bg" aria-hidden="true"></div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-title" href="{{ "/" | relURL }}">{{ .Site.Params.brandMark | default .Site.Title }}</a>
      <nav class="site-nav" aria-label="主导航">
        <ul class="nav">
          {{ range .Site.Menus.main }}
          <li>
            <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
          {{ end }}
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>© {{ now.Year }} {{ .Site.Params.companyName }}</p>
      <p class="footer-brand">{{ .Site.Params.brandMark }} · {{ .Site.Params.companyNameEn }}</p>
    </div>
  </footer>
</body>
</html>
